[project]
name = "ada"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.3.0",
    "httpx>=0.28.1",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-mongodb>=0.5.0",
    "mujoco>=3.14.0",
    "pydantic>=2.13.5",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "trulens>=2.14.0",
    "voyageai>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
